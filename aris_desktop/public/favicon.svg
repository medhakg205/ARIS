<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00878a" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#12151a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#12151a" stop-opacity="1" />
    </radialGradient>

    <!-- Neon Teal Gradient -->
    <linearGradient id="neonTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00c4c7" />
      <stop offset="100%" stop-color="#00878a" />
    </linearGradient>

    <!-- Cyber Gold Accent Gradient -->
    <linearGradient id="cyberGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5a93c" />
      <stop offset="100%" stop-color="#ffd56b" />
    </linearGradient>

    <!-- Subtle Trace Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background base rounded hex / dark plate -->
  <rect width="200" height="200" rx="36" fill="url(#bgGlow)" />
  <rect x="2" y="2" width="196" height="196" rx="34" stroke="#00878a" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Outer Hexagon Chassis (6 points: center at 100,100, r=72) -->
  <!-- (100, 28), (162.35, 64), (162.35, 136), (100, 172), (37.65, 136), (37.65, 64) -->
  <polygon points="100,28 162.35,64 162.35,136 100,172 37.65,136 37.65,64"
           stroke="url(#neonTeal)" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)" fill="#161a22" fill-opacity="0.75" />

  <!-- Secondary Inner Hexagon Track -->
  <polygon points="100,40 152,70 152,130 100,160 48,130 48,70"
           stroke="#00878a" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8 4" stroke-linejoin="round" />

  <!-- Hex Corner Micro-Vias / Nodes -->
  <circle cx="100" cy="28" r="3.5" fill="#00f0ff" />
  <circle cx="162.35" cy="64" r="3.5" fill="#00f0ff" />
  <circle cx="162.35" cy="136" r="3.5" fill="#00f0ff" />
  <circle cx="100" cy="172" r="3.5" fill="#00f0ff" />
  <circle cx="37.65" cy="136" r="3.5" fill="#00f0ff" />
  <circle cx="37.65" cy="64" r="3.5" fill="#00f0ff" />

  <!-- Hex Node Inner Rings -->
  <circle cx="162.35" cy="100" r="2.5" fill="url(#cyberGold)" />
  <circle cx="37.65" cy="100" r="2.5" fill="url(#cyberGold)" />

  <!-- Interlocking "A" & "R" Circuit Monogram -->
  <g filter="url(#glow)">
    <!-- Left Leg of A (forms Left stem of AR) -->
    <path d="M70 142 L70 58" stroke="url(#neonTeal)" stroke-width="6.5" stroke-linecap="round" />

    <!-- Top Loop of R (connected to Left stem) -->
    <path d="M70 58 L114 58 C132 58, 136 74, 136 84 C136 96, 126 102, 112 102 L70 102"
          stroke="url(#neonTeal)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Diagonal Leg of A / R Leg -->
    <path d="M106 102 L138 142" stroke="url(#cyberGold)" stroke-width="6.5" stroke-linecap="round" />

    <!-- Crossbar / Circuit Bridge of A -->
    <path d="M70 102 L112 102" stroke="url(#neonTeal)" stroke-width="6.5" stroke-linecap="round" />

    <!-- Slanted Peak of A / Diagonal Antenna Trace -->
    <path d="M70 78 L126 44" stroke="url(#cyberGold)" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 3" />
  </g>

  <!-- Accent Circuit Micro-Dots -->
  <circle cx="70" cy="58" r="2" fill="#fff" />
  <circle cx="138" cy="142" r="3" fill="#ffd56b" />
  <circle cx="70" cy="142" r="3" fill="#00f0ff" />
</svg>
